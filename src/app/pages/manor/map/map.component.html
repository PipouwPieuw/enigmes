<app-top-bar [pageText]="pageText"></app-top-bar>
<div class="app_map">
	<div class="app_map__container">
		<div class="app_map__box">
			<img class="app_map__picture" [src]="imgPath + 'map.png'" alt="Carte du manoir"/>
			<a
				class="app_map__room"
				*ngFor="let room of rooms|keyvalue"
				[routerLink]="room.value['route']"
				[title]="room.value['name']"
				[attr.aria-label]="room.value['name']"
				[style]="'top:' + room.value['posY'] + '; left:' + room.value['posX'] + '; width:' + room.value['width'] + '; height:' + room.value['height'] + ';' "
			></a>
		</div>
	</div>
</div>
