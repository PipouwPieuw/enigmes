<div class="app_top_bar">
	<div class="app_top_bar__left">
		<a *ngIf="backLink != ''" [href]="backLink" class="app_top_bar__map webfont webfont-map" title="Retourner à la carte"></a>
	</div>
	<div class="app_top_bar__right">
		<div *ngIf="pageText != ''" class="app_top_bar__text">
			<app-modal [text]="pageText"></app-modal>
		</div>
	</div>
</div>
